name: MITOS Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MITOS debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate MITOS Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer Android project files already committed to the repository root.
          PROJECT_DIR=""
          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            # Otherwise, find the uploaded project ZIP anywhere in the repository.
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No Gradle project or project ZIP was found in the repository."
              echo "Commit the extracted project files (including settings.gradle.kts and app/) or upload the project ZIP."
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/mitos-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: ZIP was found, but no settings.gradle(.kts) was found inside it."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android app module build file was not found under: $PROJECT_DIR/app"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project at: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: Build completed but expected APK was not found at $APK_PATH"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mitos-artifact"
          cp "$APK_PATH" "$RUNNER_TEMP/mitos-artifact/MITOS-debug.apk"

      - name: Upload MITOS APK
        uses: actions/upload-artifact@v4
        with:
          name: MITOS-debug-apk
          path: ${{ runner.temp }}/mitos-artifact/MITOS-debug.apk
          if-no-files-found: error
          retention-days: 30
